<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab - Club de Programación</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    
    <!-- Header/Navegación -->
    <!-- El header deberá ser un componente (en include) para reutilización -->
    <header>
        <nav>
            <div class="logo"></div>
            <div class="nav-links"></div>
            <div class="nav-buttons"></div>
        </nav>
    </header>

    <!-- Sección: Conoce sobre CodeLab -->
    <section class="seccion-conoce">
        <div class="contenedor-conoce">
            <div class="tarjeta-texto"></div>
            <div class="imagen-persona"></div>
        </div>
    </section>

    <!-- Sección: Clases Presenciales / Sobre Nosotros -->
    <section class="seccion-clases">
        <div class="encabezado-seccion"></div>
        <div class="contenedor-tarjetas">
            <div class="tarjeta"></div>
            <div class="tarjeta"></div>
            <div class="tarjeta"></div>
        </div>
    </section>

    <!-- Sección: Nuestro Desempeño -->
    <!-- Esta parte tengo entendido es sobre como hicimos el sitio u otro proyectos -->
    <!-- Posible uso de AJAX o un ser un componente (en include)-->
    <section class="seccion-desempeno">
        <div class="encabezado-desempeno"></div>
        <div class="contenedor-categorias">
            <div class="tarjeta-categoria"></div>
            <div class="tarjeta-categoria"></div>
            <div class="tarjeta-categoria"></div>
        </div>
    </section>

    <!-- Sección: Herramientas utilizadas -->
    <section class="seccion-herramientas">
        <div class="encabezado-herramientas"></div>
        <div class="contenedor-iconos">
            <div class="icono-herramienta"></div>
            <div class="icono-herramienta"></div>
            <div class="icono-herramienta"></div>
            <div class="icono-herramienta"></div>
            <div class="icono-herramienta"></div>
            <div class="icono-herramienta"></div>
        </div>
    </section>

    <!-- Sección: Deseo Formar Parte De CodeLab -->
    <section class="seccion-unirse">
        <div class="contenedor-unirse">
            <div class="ilustracion"></div>
            <div class="contenido-texto"></div>
        </div>
    </section>

    <!-- Sección: Nuestros miembros -->
     <!-- Posible aplicación de AJAX o un ser un componente (en include)-->
    <section class="seccion-miembros">
        <div class="encabezado-miembros"></div>
        <div class="filtros-miembros"></div>
        <div class="contenedor-tarjetas-miembros">
            <div class="tarjeta-miembro"></div>
            <div class="tarjeta-miembro"></div>
            <div class="tarjeta-miembro"></div>
            <div class="tarjeta-miembro"></div>
            <div class="tarjeta-miembro"></div>
            <div class="tarjeta-miembro"></div>
            <div class="tarjeta-miembro"></div>
            <div class="tarjeta-miembro"></div>
        </div>
        <div class="boton-ver-todo"></div>
    </section>

    <!-- Footer -->
    <!-- El footer deberá ser un componente (en include) -->
    <footer>
        <div class="contenedor-footer">
            <div class="columna-contacto"></div>
            <div class="columna-inicio"></div>
            <div class="columna-nosotros"></div>
            <div class="columna-redes"></div>
        </div>
        <div class="copyright"></div>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>

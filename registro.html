<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/img/logo-paginas.png" />
    <link rel="stylesheet" href="assets/css/registro.css" />
    <script
      src="https://kit.fontawesome.com/e522357059.js"
      crossorigin="anonymous"
    ></script>
    <title>Registro de Usuario</title>
  </head>
  <body>
    <!--Principal-->
    <main>
      <div class="img">
        <img src="assets/img/logo-registro-login.png" alt="CodeLab" />
      </div>
      <div class="campos-registro">
        <div class="registro-div">
          <div class="titulos">
            <h1>¡REGÍSTRATE A CODELAB!</h1>
            <h2>A unos pasos de ser parte del club</h2>
          </div>
          <form action="includes/registromiembro.php" method="POST" id="formulario-registro">
            <div class="matricula campos">
              <input
                type="number"
                name="matricula"
                id="matricula"
                placeholder="Matricula estudiantil"
                required
              />
              <i class="fa-solid fa-school"></i>
            </div>
            <div class="nombre campos">
              <input type="text" name="nombre" placeholder="Nombre" required id="nombre"/>
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="apellidos campos">
              <input
                type="text"
                name="apellidos"
                id="apellidos"
                placeholder="Apellidos"
                required
              />
              <i class="fa-solid fa-user-tie"></i>
            </div>
            <div class="email campos">
              <input
                type="email"
                name="email-institucional"
                placeholder="Correo institucional"
                required
              />
              <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="cuatrimestre campos-select">
              <!--Este campo está pendiente en aprobación-->
              <label for="">Cuatrimestre:</label>
              <select
                name="opciones-cuatrimestre"
                class="opciones-cuatrimestre"
                title="select"
                required
              >
              <option value="">Selecciona</option>
                <option value="1">Primero</option>
                <option value="2">Segundo</option>
                <option value="3">Tercero</option>
                <option value="4">Cuarto</option>
                <option value="5">Quinto</option>
                <option value="6">Sexto</option>
                <option value="7">Séptimo</option>
                <option value="8">Octavo</option>
                <option value="9">Noveno</option>
              </select>
            </div>
            <div class="contrasena campos">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                name="contraseña"
                placeholder="Contraseña"
                required
              />
              <i class="fa-regular fa-eye-slash"></i>
              <p id="mensaje-validacion" class="mensaje-validacion"></p>
            </div>
            <div class="rol campos-select">
              <label for="">Rol/Cargo</label>
              <select name="opciones-rol" title="opciones-rol" class="opciones-rol" required>
              <option value="">Selecciona</option>
                <option value="miembro">Miembro</option>
                <option value="administrador">Administrador</option>
              </select>
            </div>
            <button type="submit" name="registrar">Registrarse</button>
          </form>
        </div>
      </div>
    </main>

    <script src="assets/js/registro.js"></script>
  </body>
</html>

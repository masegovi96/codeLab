<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio de sesión - CODELAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="inicio.css">
  </head>
  <body>
    <div class="page-bg">
      <div class="container">
        <div class="card">
          <div class="left">
            <div class="image-wrap">
              <img src="ensamblador_2.png" alt="Logo CODELAB">
            </div>
          </div>

          <div class="right">
            <div class="form-wrap">
              <h2>¡INICIA SESIÓN EN CODELAB!</h2>
              <p class="muted">A unos pasos de ser parte del club</p>

              <form class="login-form" action="#" method="post" id="loginForm">
                <label class="input-group">
                  <span class="icon">✉</span>
                  <input type="email" name="correo" id="correo" placeholder="Correo institucional" required>
                </label>

                <label class="input-group" id="passwordGroup">
                  <span class="icon">🔒</span>
                  <input type="password" name="contrasena" id="contrasena" placeholder="Contraseña" minlength="8" required>
                </label>
                <p class="password-error" id="passwordError"></p>

                <button class="btn-primary" type="submit">INICIAR SESIÓN</button>
              </form>

              <p class="small muted">¿Aún no tienes cuenta? <a href="registro.html" class="link">Regístrate aquí</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const passwordInput = document.getElementById('contrasena');
      const passwordError = document.getElementById('passwordError');
      const passwordGroup = document.getElementById('passwordGroup');

      // Validación en tiempo real
      passwordInput.addEventListener('input', function() {
        validatePassword(this.value, false);
      });

      // Validación al enviar el formulario
      form.addEventListener('submit', function(e) {
        const isValid = validatePassword(passwordInput.value, true);
        if (!isValid) {
          e.preventDefault();
        }
      });

      function validatePassword(password, showError) {
        // Validar longitud mínima de 8 caracteres
        const hasMinLength = password.length >= 8;
        // Validar al menos 1 número
        const hasNumber = /\d/.test(password);
        // Validar al menos 1 carácter especial
        const hasSpecialChar = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);

        const isValid = hasMinLength && hasNumber && hasSpecialChar;

        if (showError && !isValid) {
          let errorMsg = 'La contraseña debe tener: ';
          let errors = [];
          
          if (!hasMinLength) errors.push('mínimo 8 caracteres');
          if (!hasNumber) errors.push('al menos 1 número');
          if (!hasSpecialChar) errors.push('al menos 1 carácter especial');
          
          errorMsg += errors.join(', ');
          passwordError.textContent = errorMsg;
          passwordError.style.display = 'block';
          passwordGroup.style.borderColor = '#e53e3e';
        } else if (password.length > 0 && !isValid) {
          // Mostrar error suave mientras escribe
          passwordGroup.style.borderColor = '#fc8181';
        } else {
          passwordError.textContent = '';
          passwordError.style.display = 'none';
          passwordGroup.style.borderColor = isValid ? '#48bb78' : '#e0e0e0';
        }

        return isValid;
      }
    </script>
  </body>
</html>
